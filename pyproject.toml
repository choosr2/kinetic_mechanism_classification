[project]
name = "kinetic-mech"
version = "0.1.0"
description = "Classifying catalytic reaction mechanisms from kinetic data with engineered, explainable features (CHE1147 project)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pillow==13.0.0",
    "python-docx==1.2.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "xgboost==3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]
